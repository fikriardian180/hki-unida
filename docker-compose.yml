services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hki_unida_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - ./local.ini:/usr/local/etc/php/conf.d/zz-custom.ini
    networks:
      - hki_network

  webserver:
    image: nginx:alpine
    container_name: hki_unida_webserver
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - hki_network

  db:
    image: mysql:8.0
    container_name: hki_unida_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-hki_unida}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_USER: ${DB_USERNAME:-root}
    ports:
      - "3306:3306"
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - hki_network

networks:
  hki_network:
    driver: bridge

volumes:
  dbdata:
    driver: local