version: '3.8'

services:
  # Service untuk Aplikasi Laravel
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: hki-unida-app
    container_name: hki_unida_app
    restart: unless-stopped
    tty: true
    environment:
      SERVICE_NAME: app
      SERVICE_TAGS: dev
    working_dir: /var/www
    volumes:
      - .:/var/www
      - ./docker-compose/nginx/app.conf:/etc/nginx/conf.d/default.conf
    networks:
      - hki-network

  # Service untuk Webserver Nginx
  webserver:
    image: nginx:alpine
    container_name: hki_unida_webserver
    restart: unless-stopped
    tty: true
    ports:
      - "8000:80"
    volumes:
      - .:/var/www
      - ./docker-compose/nginx/:/etc/nginx/conf.d/
    networks:
      - hki-network

  # Service untuk Database MySQL
  db:
    image: mysql:8.0
    container_name: hki_unida_db
    restart: unless-stopped
    tty: true
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: hki_unida
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - hki-network

networks:
  hki-network:
    driver: bridge

volumes:
  dbdata:
    driver: local