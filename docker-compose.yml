services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: hki-app
    container_name: hki-app
    restart: unless-stopped
    tty: true
    working_dir: /var/www
    volumes:
      - .:/var/www
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    networks:
      - hki-network

  webserver:
    image: nginx:alpine
    container_name: hki-webserver
    restart: unless-stopped
    tty: true
    ports:
      - "8000:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - hki-network

  db:
    image: mysql:8.0
    container_name: hki-db
    restart: unless-stopped
    tty: true
    ports:
      - "3307:3306"
    environment:
      MYSQL_DATABASE: hki_unida_db
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_USER: hki_user
      MYSQL_PASSWORD: hki_password
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - hki-network

networks:
  hki-network:
    driver: bridge

volumes:
  dbdata:
    driver: local